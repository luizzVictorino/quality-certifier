appId: com.sato.certificadoqualidade
productName: Quality Certifier
copyright: Certificado de Qualidade
directories:
  output: dist-desktop
  buildResources: build
files:
  - electron/**
  - desktop/dist-web/**/*
  - package.json
extraMetadata:
  main: electron/main.cjs
publish:
  - provider: github
    owner: luizzVictorino
    repo: quality-certifier
    releaseType: release
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: Quality-Certifier-${version}-${arch}.${ext}
  icon: build/icon.ico
portable:
  artifactName: Quality-Certifier-Portable-${version}.exe
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Quality Certifier
  artifactName: Quality-Certifier-Setup-${version}.exe
  uninstallDisplayName: Quality Certifier
  differentialPackage: false
